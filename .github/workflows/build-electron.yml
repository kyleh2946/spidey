name: Build Spidey Pet Desktop App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: artifacts/electron-pet
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item package-lock.json }
          npm install

      - name: Build app
        working-directory: artifacts/electron-pet
        shell: pwsh
        run: npm exec electron-vite -- build

      - name: Package for Windows
        working-directory: artifacts/electron-pet
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm exec electron-builder -- --win --x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: spidey-pet-windows
          path: artifacts/electron-pet/release/*.exe
